# ── i3 session on agent display (:99) ───────────────────────────────
[program:i3-agent]
command=/bin/sh -c '\
  supervisorctl start xvfb; \ 
  while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; \
  su - %(ENV_RDP_USER)s -c "\
    export DISPLAY=:99; \
    export CONTAINER_HOST=unix:///run/podman/podman.sock; \
    export DOCKER_HOST=unix:///run/podman/podman.sock;\
    export XDG_RUNTIME_DIR=/run/user/$(id -u %(ENV_RDP_USER)s); \
    mkdir -p \$XDG_RUNTIME_DIR; chmod 700 \$XDG_RUNTIME_DIR; \
    exec i3"'
autorestart=true
autostart=false
startsecs=3
priority=20