# ── Openbox session on agent display (:99) ──────────────────────────
[program:openbox-agent]
command=/bin/sh -c '\
  while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; \
  su - %(ENV_RDP_USER)s -c "\
    export DISPLAY=:99; \
    export XDG_RUNTIME_DIR=/run/user/$(id -u %(ENV_RDP_USER)s); \
    mkdir -p \$XDG_RUNTIME_DIR; chmod 700 \$XDG_RUNTIME_DIR; \
    exec openbox-session"'
autorestart=true
startsecs=3
priority=20
