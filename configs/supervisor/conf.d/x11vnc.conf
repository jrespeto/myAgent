# ── VNC server on agent display (:99) — port 5901 ───────────────────
[program:x11vnc]
command=/bin/sh -c '\
  supervisorctl start xvfb; \
  while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done; \
  exec x11vnc -display :99 \
    -listen 127.0.0.1 \
    -localhost \
    -forever -shared \
    -rfbport 5901 \
    -nopw \
    -noxdamage \
    -repeat \
    -xrandr'
autorestart=true
autostart=false
priority=30
