[program:hermes-dash]
user=hermes
environment=HOME=/home/hermes,USER=hermes
directory=/home/hermes
command=/bin/bash -lic '/home/hermes/.local/bin/hermes dashboard --host 0.0.0.0 --no-open --insecure'
stdout_logfile=/var/log/supervisor/hermes-dash.log
redirect_stderr=true
autorestart=true
autostart=false
priority=80