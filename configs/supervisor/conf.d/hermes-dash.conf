[program:hermes-dash]
user=%(ENV_RUN_USER)s
environment=HOME=/home/%(ENV_RUN_USER)s,USER=%(ENV_RUN_USER)s
directory=/home/%(ENV_RUN_USER)s
command=/bin/bash -lic '/home/%(ENV_RUN_USER)s/.local/bin/hermes dashboard --host 0.0.0.0 --no-open --insecure'
stdout_logfile=/var/log/supervisor/hermes-dash.log
redirect_stderr=true
autorestart=true
autostart=false
priority=80