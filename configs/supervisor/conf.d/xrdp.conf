# ── xrdp session manager ────────────────────────────────────────────
[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
autorestart=true
priority=40

# ── xrdp server (RDP on :3389) ──────────────────────────────────────
[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
autorestart=true
priority=50