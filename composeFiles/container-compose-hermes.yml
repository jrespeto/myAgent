services:
  hermes:
    build:
      context: ./
      dockerfile: Docker/Dockerfile
      args:
        HOME: /hermes
        NVM_DIR: /hermes/.nvm
        RDP_USER: hermes
        RDP_PASSWORD: hermes
        # Desktop environment: i3 | openbox
        DTE: i3
    ports:
      - "43389:3389"  # RDP  — user session
      # - "9119:9119" # Hermes Dashboard - access over netbird 
      # - "3100:3100" # PaperClip
      - "2202:22"     # SSH 
    restart: unless-stopped
    privileged: true
    shm_size: "8g"
    env_file:
      - .env
    environment:
      TZ: "America/New_York"
      RDP_USER: hermes
      RDP_PASSWORD: hermes
      CONTAINER_HOST: unix:///run/podman/podman.sock
      DOCKER_HOST: unix:///run/podman/podman.sock
      NB_ALLOW_SERVER_SSH: true
      NB_ENABLE_SSH_ROOT: true
      NB_DISABLE_SSH_AUTH: true
      NB_SETUP_KEY: ${NB_SETUP_KEY}
      NB_HOSTNAME: ${NB_HOSTNAME}
      NB_MANAGEMENT_URL: ${NB_MANAGEMENT_URL}
    volumes:
      - ./hermes-home:/home/hermes
      - ./linuxbrew:/home/linuxbrew
      - ./nix:/nix
      - /var/run/podman/podman.sock:/run/podman/podman.sock
      - /var/lib/containers:/var/lib/containers

